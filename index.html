  <body style="overflow-x: hidden;">
<div id="envelope-wrapper" class="envelope-wrapper">
  <img id="envelope-img" src="./assets/envelope-illustration-viyIlQ4t.png" alt="Tap to open" class="envelope-img" />
  <video id="reveal-video" src="./assets/reveal_video.mp4" playsinline muted class="reveal-video"></video>

<div id="root"></div>
    <script>
      window.addEventListener('load', function() {
        let applied = false;
        
        let videoUnlocked = false;
        let video = null;
        let envelopeClicked = false;
        
        document.addEventListener('click', function(e) {
            if (!videoUnlocked) {
                videoUnlocked = true;
                
                video = document.createElement('video');
                video.src = './assets/reveal_video.mp4';
                video.playsInline = true;
                video.muted = true; // mute initially to guarantee unlock

                video.style.position = 'fixed';
                video.style.top = '0';
                video.style.left = '0';
                video.style.width = '100vw';
                video.style.height = '100vh';
                video.style.objectFit = 'cover';
                video.style.zIndex = '999999';
                video.style.backgroundColor = 'black';
                video.style.opacity = '0';
                video.style.pointerEvents = 'none';
                
                document.body.appendChild(video);
                
                video.play().then(() => {
                    video.pause();
                    video.currentTime = 0;
                }).catch(err => {
                    console.error('Video unlock failed:', err);
                });
                
                video.onended = () => {
                    video.style.transition = 'opacity 1s ease';
                    video.style.opacity = '0';
                    video.style.pointerEvents = 'none';
                    setTimeout(() => video.remove(), 1000);
                };
            }
            
            if (!envelopeClicked) {
                let hasEnvelope = false;
                const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
                let node;
                while (node = walker.nextNode()) {
                    if (node.nodeValue.trim().toLowerCase() === 'tap to open') {
                        hasEnvelope = true;
                        break;
                    }
                }
                
                if (hasEnvelope) {
                    envelopeClicked = true;
                    setTimeout(() => {
                        if (video) {
                             video.style.opacity = '1';
                             video.style.pointerEvents = 'auto';
                             // Ensure the video is loaded before playing
                             video.muted = false;
                             video.load();
                             video.play().catch(err => {
                                 console.error('Delayed play failed:', err);
                                 video.remove(); // Remove the black screen if browser blocks it!
                             });
                        }
                    }, 2500); // Wait for envelope animation to finish
                }
            }
        }, true);

        const observer = new MutationObserver(function() {
          if (applied) return;
          
          const elements = document.querySelectorAll('*');
          let dateContainer = null;
          
          for (let i = 0; i < elements.length; i++) {
             const el = elements[i];
             const text = el.innerText || '';
             if (el.tagName !== 'SCRIPT' && el.tagName !== 'STYLE' && text.match(/202[4-9]/) && text.length < 60 && el.children.length < 5) {
                 let isDeepest = true;
                 for (let j = 0; j < el.children.length; j++) {
                     if (el.children[j].innerText && el.children[j].innerText.match(/202[4-9]/)) {
                         isDeepest = false;
                         break;
                     }
                 }
                 if (isDeepest) {
                     dateContainer = el;
                     break;
                 }
             }
          }
          
          if (dateContainer && !applied) {
            applied = true;
            setTimeout(() => {
              // Extract date parts
              const text = dateContainer.innerText || '';
              let day = '25', month = '07', year = '2026'; // Default fallback
              // Matches formats like "25 07 2026", "25 July 2026", "2026-07-25" (reversed)
              const match = text.match(/(\d{1,2})[^\d]+(\d{1,2}|[a-zA-Z]+)[^\d]+(\d{4})/);
              if (match) {
                  day = match[1];
                  month = match[2];
                  year = match[3];
              } else if (text.match(/(\d{4})[^\d]+(\d{1,2})[^\d]+(\d{1,2})/)) {
                  const m = text.match(/(\d{4})[^\d]+(\d{1,2})[^\d]+(\d{1,2})/);
                  year = m[1]; month = m[2]; day = m[3];
              }

              // Hide original text but keep layout structure mostly intact if possible
              // Hide original text but keep layout structure mostly intact if possible
              dateContainer.innerHTML = '';
              dateContainer.style.display = 'flex';
              dateContainer.style.flexDirection = 'column';
              dateContainer.style.alignItems = 'center';
              dateContainer.style.marginTop = '15px';
              dateContainer.style.marginBottom = '20px';
              
              const titleEl = document.createElement('div');
              titleEl.textContent = 'Reveal';
              titleEl.style.fontSize = '2rem';
              titleEl.style.fontFamily = 'inherit';
              titleEl.style.marginBottom = '5px';
              
              const subtitleEl = document.createElement('div');
              subtitleEl.textContent = 'Scratch to Discover the Date';
              subtitleEl.style.fontSize = '1rem';
              subtitleEl.style.fontFamily = 'inherit';
              subtitleEl.style.marginBottom = '20px';
              subtitleEl.style.letterSpacing = '1px';
              
              dateContainer.appendChild(titleEl);
              dateContainer.appendChild(subtitleEl);
              
              const sealsWrapper = document.createElement('div');
              sealsWrapper.style.display = 'flex';
              sealsWrapper.style.justifyContent = 'center';
              sealsWrapper.style.gap = '15px';
              sealsWrapper.style.flexWrap = 'nowrap';
              dateContainer.appendChild(sealsWrapper);
              
              // Load confetti script
              if (!document.getElementById('confetti-script')) {
                  const script = document.createElement('script');
                  script.id = 'confetti-script';
                  script.src = 'https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js';
                  document.head.appendChild(script);
              }

              const parts = [
                  { label: 'Day', value: day },
                  { label: 'Month', value: month },
                  { label: 'Year', value: year }
              ];
              
              let revealedCount = 0;
              
              const triggerConfetti = () => {
                  if (!window.confetti) {
                      setTimeout(triggerConfetti, 100);
                      return;
                  }
                  var duration = 2000;
                  var end = Date.now() + duration;
                  var frame = function() {
                      confetti({
                          particleCount: 5,
                          angle: 60,
                          spread: 55,
                          origin: { x: 0 },
                          colors: ['#d4af37', '#fcf9f2', '#ffffff', '#7d5e28'],
                          zIndex: 1000
                      });
                      confetti({
                          particleCount: 5,
                          angle: 120,
                          spread: 55,
                          origin: { x: 1 },
                          colors: ['#d4af37', '#fcf9f2', '#ffffff', '#7d5e28'],
                          zIndex: 1000
                      });
                      if (Date.now() < end) {
                          requestAnimationFrame(frame);
                      }
                  };
                  frame();
              };
              
              const img = new Image();
              img.crossOrigin = 'Anonymous';
              img.src = './assets/scratch-gold.png';
              
              img.onload = () => {
                  parts.forEach(part => {
                      const wrapper = document.createElement('div');
                      wrapper.style.position = 'relative';
                      wrapper.style.width = '100px';
                      wrapper.style.height = '100px';
                      wrapper.style.borderRadius = '50%';
                      wrapper.style.boxShadow = '0 8px 16px rgba(0,0,0,0.15)';
                      wrapper.style.background = 'transparent'; 
                      wrapper.style.display = 'flex';
                      wrapper.style.flexDirection = 'column';
                      wrapper.style.justifyContent = 'center';
                      wrapper.style.alignItems = 'center';
                      wrapper.style.overflow = 'hidden';
                      wrapper.style.flexShrink = '0'; // Prevent shrinking that could distort it
                      
                      // The text underneath
                      const valueEl = document.createElement('div');
                      valueEl.textContent = part.value;
                      valueEl.style.fontSize = part.label === 'Year' ? '22px' : '28px';
                      valueEl.style.fontFamily = 'inherit';
                      valueEl.style.color = '#5a4018';
                      valueEl.style.lineHeight = '1';
                      valueEl.style.fontWeight = 'bold';
                      
                      const labelEl = document.createElement('div');
                      labelEl.textContent = part.label;
                      labelEl.style.fontSize = '10px';
                      labelEl.style.fontFamily = 'inherit';
                      labelEl.style.color = '#7d5e28';
                      labelEl.style.textTransform = 'uppercase';
                      labelEl.style.letterSpacing = '1px';
                      labelEl.style.marginTop = '4px';
                      
                      wrapper.appendChild(valueEl);
                      wrapper.appendChild(labelEl);
                      
                      // The canvas on top
                      const canvas = document.createElement('canvas');
                      canvas.width = 100;
                      canvas.height = 100;
                      canvas.style.position = 'absolute';
                      canvas.style.top = '0';
                      canvas.style.left = '0';
                      canvas.style.width = '100%';
                      canvas.style.height = '100%';
                      canvas.style.zIndex = '50';
                      canvas.style.cursor = 'crosshair';
                      canvas.style.transition = 'opacity 0.5s ease-out';
                      
                      const ctx = canvas.getContext('2d');
                      ctx.drawImage(img, 0, 0, 100, 100);
                      
                      wrapper.appendChild(canvas);
                      sealsWrapper.appendChild(wrapper);
                      
                      let isDrawing = false;
                      let isRevealed = false;
                      
                      const getPos = (e) => {
                          const rect = canvas.getBoundingClientRect();
                          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                          return {
                             x: (clientX - rect.left) * (canvas.width / rect.width),
                             y: (clientY - rect.top) * (canvas.height / rect.height)
                          };
                      };
                      
                      const scratch = (e) => {
                          if (!isDrawing) return;
                          const pos = getPos(e);
                          ctx.globalCompositeOperation = 'destination-out';
                          ctx.beginPath();
                          ctx.arc(pos.x, pos.y, 12, 0, Math.PI * 2, false);
                          ctx.fill();
                      };
                      
                      const checkReveal = () => {
                          if (isRevealed) return;
                          const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                          let transparent = 0;
                          for (let i = 3; i < data.length; i += 4) {
                              if (data[i] < 128) transparent++;
                          }
                          if (transparent / (canvas.width * canvas.height) > 0.5) {
                              isRevealed = true;
                              canvas.style.opacity = '0';
                              setTimeout(() => canvas.remove(), 500);
                              
                              revealedCount++;
                              if (revealedCount === 3) {
                                  triggerConfetti();
                              }
                          }
                      };
                      
                      canvas.addEventListener('mousedown', () => isDrawing = true);
                      canvas.addEventListener('mousemove', scratch);
                      canvas.addEventListener('mouseup', () => { isDrawing = false; checkReveal(); });
                      canvas.addEventListener('mouseleave', () => { isDrawing = false; checkReveal(); });
                      canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
                      canvas.addEventListener('touchmove', (e) => { e.preventDefault(); scratch(e); }, {passive: false});
                      canvas.addEventListener('touchend', () => { isDrawing = false; checkReveal(); });
                  });
              };
            }, 500);
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      });
</script>
<script>
window.addEventListener('load', () => {
  const wrapper = document.getElementById('envelope-wrapper');
  const img = document.getElementById('envelope-img');
  const video = document.getElementById('reveal-video');

  // Unlock video on first interaction (required for mobile autoplay)
  const unlockVideo = () => {
    video.play().then(() => { video.pause(); video.currentTime = 0; }).catch(() => {});
    document.removeEventListener('click', unlockVideo);
  };
  document.addEventListener('click', unlockVideo, {once: true});

  wrapper.addEventListener('click', (e) => {
    e.stopPropagation();
    img.classList.add('fade-out');
    setTimeout(() => {
      img.style.display = 'none';
      video.style.display = 'block';
      video.muted = false;
      video.play();
    }, 500);
  });

  video.onended = () => {
    wrapper.remove();
  };
});
</script>
